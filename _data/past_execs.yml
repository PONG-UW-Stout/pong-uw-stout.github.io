# _data/past_execs.yml
#
# PONG executive boards by academic year. The academic year runs August to May.
# Terms actually begin at the spring election, so a board labelled 2016-2017 was
# elected in March 2016 and sworn in that April.
#
# Rules used here:
#   - position known, person not  -> name: Unknown
#   - person known, position not  -> position: "Exec, role unknown"
#   - whole year unknown          -> the year is still listed, with a note
#
# Position titles are the ones the sources use for that era. Sponsorship Liaison
# was later renamed Ambassador, Tournament Coordinator became Games Coordinator,
# and Webmaster became Web Administrator. The exact changeover years are not
# confirmed; see the notes on /history/exec-boards-of-the-past.
#
# Sources: the PONG history vault, the club's Dropbox archive (org renewal
# filings, meeting notes, election records, budget papers), the 2026 history
# recording, and answers from the current exec board.

- year: "2001-2002"
  note: >-
    PONG's founding year. Eric Landru is the founding president. An archived 2002 club news post records a five-seat board: president, vice president, treasurer, secretary and public relations.
  board:
      - position: "President"
        name: "Eric Landru"
      - position: "Vice President"
        name: "Unknown"
      - position: "Treasurer"
        name: "Unknown"
      - position: "Secretary"
        name: "Unknown"
      - position: "Public Relations"
        name: "Unknown"


# _data/frogger_boards.yml
# Boards for /games/frogger/. Each one becomes a button on the page, in the
# order listed here.
#
# rows run top to bottom. The first row is always the far bank with the bays in
# it and the last is always the bank the frog starts on, whatever you write
# there. Everything between them is yours, in any order: road above river,
# river above road, two rivers in a row, a bank to rest on halfway up.
#
#   kind:  home | bank | road | river
#   dir:   1 moves right, -1 moves left
#   speed: cells per second
#   len:   length in cells (a log or a long truck)
#   gap:   clear cells behind each one, so speed and gap together set how often
#          one comes past
#   look:  car1, car2, car3 or car4 to pick a colour. Optional, roads only.
#
# cols is the width of the board in cells and bays is how many slots to fill.
# Cells are kept square, so more rows than cols makes a taller board.

- name: Classic
  slug: classic
  cols: 13
  bays: 5
  rows:
    - kind: home
    - { kind: river, dir:  1, speed: 1.3, len: 3, gap: 3 }
    - { kind: river, dir: -1, speed: 1.9, len: 2, gap: 3 }
    - { kind: river, dir:  1, speed: 1.0, len: 4, gap: 4 }
    - { kind: river, dir: -1, speed: 2.4, len: 2, gap: 4 }
    - { kind: river, dir:  1, speed: 1.6, len: 3, gap: 3 }
    - kind: bank
    - { kind: road, dir: -1, speed: 2.6, len: 1, gap: 4, look: car1 }
    - { kind: road, dir:  1, speed: 1.8, len: 1, gap: 5, look: car2 }
    - { kind: road, dir: -1, speed: 3.2, len: 1, gap: 6, look: car3 }
    - { kind: road, dir:  1, speed: 2.2, len: 2, gap: 5, look: car4 }
    - { kind: road, dir: -1, speed: 1.4, len: 1, gap: 4 }
    - kind: bank

# Road and river alternating the whole way up, so you are never settled into
# one kind of hazard for long.
- name: Crossfire
  slug: crossfire
  cols: 13
  bays: 5
  rows:
    - kind: home
    - { kind: road,  dir: -1, speed: 2.4, len: 1, gap: 5, look: car1 }
    - { kind: river, dir:  1, speed: 1.4, len: 3, gap: 3 }
    - { kind: road,  dir:  1, speed: 1.9, len: 2, gap: 5, look: car4 }
    - { kind: river, dir: -1, speed: 2.0, len: 3, gap: 4 }
    - kind: bank
    - { kind: river, dir:  1, speed: 1.1, len: 4, gap: 4 }
    - { kind: road,  dir: -1, speed: 2.8, len: 1, gap: 5, look: car3 }
    - { kind: river, dir: -1, speed: 1.7, len: 3, gap: 3 }
    - { kind: road,  dir:  1, speed: 1.6, len: 1, gap: 4, look: car2 }
    - kind: bank

# All water. Long slow rafts low down, short quick ones near the top.
- name: Rapids
  slug: rapids
  cols: 13
  bays: 5
  rows:
    - kind: home
    - { kind: river, dir: -1, speed: 2.6, len: 2, gap: 3 }
    - { kind: river, dir:  1, speed: 2.1, len: 2, gap: 3 }
    - { kind: river, dir: -1, speed: 1.7, len: 3, gap: 3 }
    - kind: bank
    - { kind: river, dir:  1, speed: 1.3, len: 4, gap: 4 }
    - { kind: river, dir: -1, speed: 1.0, len: 4, gap: 3 }
    - { kind: river, dir:  1, speed: 1.5, len: 3, gap: 3 }
    - kind: bank

# All traffic, and plenty of it. The bays are right above the fast lane.
- name: Rush Hour
  slug: rush-hour
  cols: 13
  bays: 5
  rows:
    - kind: home
    - { kind: road, dir:  1, speed: 3.4, len: 1, gap: 5, look: car3 }
    - { kind: road, dir: -1, speed: 2.2, len: 2, gap: 5, look: car4 }
    - { kind: road, dir:  1, speed: 2.7, len: 1, gap: 4, look: car1 }
    - kind: bank
    - { kind: road, dir: -1, speed: 1.9, len: 1, gap: 4, look: car2 }
    - { kind: road, dir:  1, speed: 3.0, len: 1, gap: 6, look: car3 }
    - { kind: road, dir: -1, speed: 1.5, len: 2, gap: 4, look: car4 }
    - { kind: road, dir:  1, speed: 2.4, len: 1, gap: 5, look: car1 }
    - kind: bank

# Short and wide, for one quick go.
- name: Sprint
  slug: sprint
  cols: 9
  bays: 3
  rows:
    - kind: home
    - { kind: river, dir:  1, speed: 1.5, len: 3, gap: 3 }
    - { kind: river, dir: -1, speed: 2.0, len: 2, gap: 3 }
    - kind: bank
    - { kind: road,  dir: -1, speed: 2.4, len: 1, gap: 4, look: car1 }
    - { kind: road,  dir:  1, speed: 1.8, len: 1, gap: 4, look: car2 }
    - kind: bank

---
title: PONG
layout: default
description: Pong is a two-dimensional sports game that simulates table tennis
---

<link rel="stylesheet" href="{{ '/assets/css/games/pong.css' | relative_url }}">




<div class="court" aria-hidden="true">
    <div class="net"></div>
    <div class="score">
        <span class="score_num" data-score="yaoi">0</span>
        <span class="score_num" data-score="yuri">0</span>
    </div>
    <p class="court-message" id="pong-message" hidden></p>
    <div class="paddle" id="paddle-yaoi"></div>
    <div class="paddle" id="paddle-yuri"></div>
    <div class="ball"></div>
</div>

<div class="game-controls">
    <button type="button" class="mode-button" data-mode="one-player" aria-pressed="false">
        One Player
    </button>

    <button type="button" class="mode-button" data-mode="two-player" aria-pressed="true">
        Two Player
    </button>
</div>

<p class="game-note">
Left plays with <kbd>W</kbd> and <kbd>S</kbd>, Right with the arrow keys.
Drag inside either half to move that paddle. <kbd>Space</kbd> starts a match and pauses one.
First to <span class="number">11</span> wins.
</p>

<script src="{{ '/assets/js/games/pong.js' | relative_url }}"></script>
